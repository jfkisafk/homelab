services:
  neo4j:
    restart: always
    image: neo4j:2026.08.1-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_server_bolt_advertised__address: "darkstar.dohne-hue.ts.net:30687"
    volumes:
      - "./data:/data"
    ports:
      - 30474:7474
      - 30687:7687
